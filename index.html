<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>경찰서별 집회신고 장소</title><style>
*{box-sizing:border-box}body{font-family:system-ui,"Noto Sans KR",sans-serif;background:#091324;color:#eef5ff;margin:0}.wrap{max-width:1400px;margin:auto;padding:20px}h1{font-size:25px}.muted{color:#a8bad3}.grid,.btns{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.metric,.panel{background:#192a45;border:1px solid #354e72;border-radius:13px;padding:17px}.metric{flex:1;min-width:145px}.big{font-size:27px;font-weight:800;margin-top:7px}button{cursor:pointer;border:1px solid #47648c;background:#273e61;color:white;border-radius:8px;padding:10px 13px;font-weight:700}button.active{background:#2875cb}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}input{min-width:190px;flex:1;padding:10px;background:#0d1a30;border:1px solid #46608b;color:white;border-radius:8px}table{border-collapse:collapse;width:100%;margin-top:15px}td,th{padding:11px;border-bottom:1px solid #334864;text-align:left;font-size:14px}th{color:#c7d9f1}.scroll{overflow:auto}.hint{padding:12px;border-radius:8px;background:#342d25;color:#ffe3ac}.pill{background:#384d6d;border-radius:15px;padding:3px 8px;white-space:nowrap}@media print{body{background:white;color:black}.btns,.toolbar,.hint{display:none}.panel{border:0}th,td{color:black}}
</style></head><body><main class="wrap"><h1>관할 경찰서별 집회신고 대상 현황판</h1><p class="muted">현장 현황 JSON 연동 · 경찰서 단추 중심 · 지부 자동 표기</p><div class="grid"><div class="metric">전체 장소<div class="big" id="total">-</div></div><div class="metric">주소 기재<div class="big" id="addr">-</div></div><div class="metric">관할 확인 완료<div class="big" id="done">-</div></div><div class="metric">관할 확인 필요<div class="big" id="pending">-</div></div></div><p class="hint">모의실험용입니다. 관할 경찰서가 아직 검증되지 않은 주소는 임의 배정하지 않으며, 실제 제출 전 확인해야 합니다. 신고서 지부 선택이나 만료일 계산 기능은 없습니다.</p><div class="panel"><h2>관할 경찰서별 보기</h2><div class="btns" id="buttons">데이터 불러오는 중…</div><div class="toolbar"><input id="search" placeholder="현장명·주소·지부 검색"><button id="download">현재 목록 CSV</button><button onclick="window.print()">인쇄</button></div><p id="summary" class="muted"></p><div class="scroll"><table><thead><tr><th>번호</th><th>현장명 / 장소</th><th>주소</th><th>지부</th><th>구분</th><th>관할 경찰서</th></tr></thead><tbody id="rows"></tbody></table></div></div></main>
<script>
const source="https://raw.githubusercontent.com/hktower226-lang/site-status-dashboard/main/data.json";
const byId=id=>document.getElementById(id);const escapeHtml=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let places=[],selected="전체",visible=[];
async function read(url){const r=await fetch(url+(url.includes("?")?"&":"?")+"v="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error(url+" "+r.status);return r.json()}
function police(p){return p.police||"관할 확인 필요"}
function render(){const names=["전체",...new Set(places.map(police))];byId("buttons").innerHTML=names.map(n=>'<button class="'+(selected===n?"active":"")+'" data-name="'+escapeHtml(n)+'">'+escapeHtml(n)+' ('+(n==="전체"?places.length:places.filter(x=>police(x)===n).length)+')</button>').join("");byId("buttons").querySelectorAll("button").forEach(b=>b.onclick=()=>{selected=b.dataset.name;render()});let q=byId("search").value.trim().toLowerCase();visible=places.filter(p=>(selected==="전체"||police(p)===selected)&&[p.name,p.address,p.branch,p.kind].join(" ").toLowerCase().includes(q));byId("summary").textContent=selected+" · "+visible.length+"곳";byId("rows").innerHTML=visible.map((p,i)=>"<tr><td>"+(i+1)+"</td><td>"+escapeHtml(p.name)+"</td><td>"+escapeHtml(p.address||"주소 미기재")+"</td><td><span class=pill>"+escapeHtml(p.branch||"미분류")+"</span></td><td>"+escapeHtml(p.kind)+"</td><td>"+escapeHtml(police(p))+"</td></tr>").join("")||'<tr><td colspan="6">표시할 장소 없음</td></tr>'}
function csv(){let rows=[["번호","관할 경찰서","현장명","주소","지부","구분"],...visible.map((p,i)=>[i+1,police(p),p.name,p.address,p.branch,p.kind])];let s="\ufeff"+rows.map(a=>a.map(v=>'"'+String(v??"").replaceAll('"','""')+'"').join(",")).join("\r\n");const u=URL.createObjectURL(new Blob([s],{type:"text/csv;charset=utf-8"}));const a=document.createElement("a");a.href=u;a.download="집회신고_"+selected+".csv";a.click();URL.revokeObjectURL(u)}
async function main(){try{const [raw,extra,juris]=await Promise.all([read(source),read("./extra-locations.json"),read("./jurisdiction.json")]);places=Object.entries(raw.sheets||{}).flatMap(([sheet,records])=>records.map((p,i)=>({id:sheet+"-"+i,name:p["현장명"],address:String(p["현장주소"]||"").trim(),branch:p["구분"],kind:sheet==="소형"?"소형":"현장",police:""})));places.push(...(extra.places||[]).map(p=>({...p,kind:"별도 장소",police:""})));for(const p of places){const x=(juris.assignments||[]).find(x=>x.id===p.id||(x.address===p.address&&x.name===p.name));if(x?.confirmed===true&&x.police)p.police=x.police}byId("total").textContent=places.length;byId("addr").textContent=places.filter(p=>p.address).length;byId("done").textContent=places.filter(p=>p.police).length;byId("pending").textContent=places.filter(p=>!p.police).length;render()}catch(e){byId("buttons").textContent="데이터 불러오기 오류: "+e.message}}
byId("search").oninput=render;byId("download").onclick=csv;main();
</script></body></html>
